# ========================================================
# BERRY MILK LINE AI Concierge Bot Configuration
# ========================================================

# Server Port
server.port=${PORT:8080}

# LINE Messaging API Configuration (Loaded from Environment Variables)
bot.line-channel-secret=${LINE_CHANNEL_SECRET:}
bot.line-channel-access-token=${LINE_CHANNEL_ACCESS_TOKEN:}

# Google Gemini API Configuration (Loaded from Environment Variables)
bot.gemini-api-key=${GEMINI_API_KEY:}
bot.gemini-model=${GEMINI_MODEL:gemini-1.5-flash}

# Logging
logging.level.com.berrymilk.linebot=INFO
logging.level.org.springframework.web=INFO
